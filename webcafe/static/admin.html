<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Orders · WebCafe</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <style>
    body { background: var(--cream); }
    .wrap { width: min(1000px, 100% - 32px); margin: 40px auto; }
    .login { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    .login input { flex: 1; min-width: 200px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); font: inherit; }
    .order { background: #fff; border-radius: 16px; padding: 20px 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
    .order header { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .order ul { margin: 8px 0; padding-left: 18px; }
    
    .pill.paid { background: #2e7d32; }
    .pill { background: var(--ink); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 12px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Incoming orders</h1>
    <form class="login" id="login">
      <input type="password" id="key" placeholder="Admin key (ADMIN_KEY)" required>
      <button class="btn btn-dark">Load orders</button>
    </form>
    <p class="muted" id="msg"></p>
    <div id="list"></div>
  </div>
  <script>
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    async function load() {
      const key = document.getElementById("key").value;
      const res = await fetch("/api/orders", { headers: { "X-Admin-Key": key } });
      const data = await res.json();
      const msg = document.getElementById("msg");
      if (!res.ok) { msg.textContent = data.error; return; }
      msg.textContent = `${data.length} order(s). Auto-refreshing every 15s.`;
      document.getElementById("list").innerHTML = data.map((o) => `
        <article class="order">
          <header><strong>${esc(o.orderId)} · ${esc(o.customer.name)} · ${esc(o.customer.phone)}</strong>
            <span><span class="pill ${o.status === "paid" ? "paid" : ""}">${esc(o.status.replace("_", " "))}</span> <span class="pill">${esc(o.customer.mode)}</span> ${new Date(o.createdAt).toLocaleString()}</span></header>
          <div>✉️ ${esc(o.customer.email || "")}</div>
          ${o.customer.address ? `<div>📍 ${esc(o.customer.address)}</div>` : ""}
          <ul>${o.items.map((i) => `<li>${i.qty} × ${esc(i.name)}${i.sizeLabel ? ` (${esc(i.sizeLabel)})` : ""} — ${esc(o.currency)}${i.lineTotal.toFixed(2)}</li>`).join("")}</ul>
          ${o.customer.notes ? `<div class="muted">Note: ${esc(o.customer.notes)}</div>` : ""}
          <strong>Total: ${esc(o.currency)}${o.total.toFixed(2)}</strong>
        </article>`).join("");
    }
    let timer;
    document.getElementById("login").addEventListener("submit", (e) => {
      e.preventDefault(); load(); clearInterval(timer); timer = setInterval(load, 15000);
    });
  </script>
</body>
</html>
